# Generic compose file for one self-hosted runner instance, built from the
# image in this directory (`Dockerfile` + `entrypoint.sh`). No org URL, host
# name, tailnet address or group ID is baked in here — see runner/README.md
# for what every env var means and how to size the resources below for your
# own box. This file is a template: copy it per runner (state dir, work dir,
# container/service name, RUNNER_NAME must all be unique per instance) and
# fill in the host paths and env values for your own infrastructure.
#
# Docker-out-of-docker note: RUNNER_WORKDIR must be bind-mounted at the
# IDENTICAL absolute path inside the container as on the host, because
# container actions and `uses: docker://` steps run as sibling containers
# via the mounted docker socket and see host paths, not container paths.
#
# Recorded drift (deliberate, not an oversight): the box's own copy, running
# the actual `hf-ci-runner` compose project, is NOT byte-identical to this
# template. It differs in exactly these ways:
#   - `image:` is tagged `hf-runner:<YYYYMMDD>` (the date the image was
#     built on the box), not `hf-runner:local`.
#   - `group_add: ["<docker gid>"]` is added — a bare numeric GID with no
#     org/host meaning on its own, so it's left out of this public template
#     rather than baked in; entrypoint.sh maps the socket's GID generically
#     regardless, so this is belt-and-braces, not load-bearing.
#   - `TZ` is pinned to a fixed zone instead of left at the `${TZ:-UTC}`
#     default below.
#   - the box wires the job-started and job-completed hooks and the shared cache
#     root into every runner (see the commented block under `environment:` /
#     `volumes:` below, README.md "Job rows" and "Cache pruning"), sets
#     HF_CI_PRUNE_IMAGE to its own runner image tag so the prune container
#     matches the runner build, and sets the box-specific prune knobs
#     (HF_CI_CACHE_CAPS, HF_CI_BUILDER_CONTAINER, BUILDX_CONFIG) as literal
#     values in its own compose file.
#   - once the CI cgroup slice exists (ADR 0002 decision 10), the box adds
#     `cgroup_parent: hf-ci.slice` to every runner service and
#     HF_CI_CGROUP_PARENT to the runner environment (commented below).
#   - RUNNER_HOME is set to the per-runner state dir, bind-mounted at the SAME
#     absolute path on both sides (see entrypoint.sh), instead of the template's
#     `${RUNNER_STATE_DIR}:/runner`: container actions mount the runner's
#     externals dir via the host daemon, which only resolves a host-visible path.
#   - sizing differs per runner, which a one-service template cannot express:
#     the box runs two "heavy" runners (3 GiB, 2 CPUs) and one "light" runner
#     (1.5 GiB, 2 CPUs; at 1 CPU it ran 15-50% slower than the others and still
#     took about a third of the light jobs). CPU is not the saturated resource,
#     disk I/O is, so a light runner gets the full 2 CPUs and only less memory.
#   - the box runs this as MULTIPLE services (one per runner, e.g.
#     `runner-1`/`runner-2`) under one compose project, each with its own
#     `state-N`/`work-N` host directories and RUNNER_NAME — this file
#     defines a single `runner` service as the template to copy per
#     instance, per the instructions in README.md.

services:
  runner:
    build: .
    image: hf-runner:local
    restart: always
    environment:
      RUNNER_URL: ${RUNNER_URL:?set the GitHub org or repo URL to register against}
      RUNNER_NAME: ${RUNNER_NAME:?set a name unique per org/group}
      RUNNER_GROUP: ${RUNNER_GROUP:?set the runner group to join}
      RUNNER_LABELS: ${RUNNER_LABELS:?set the custom labels, comma-separated}
      RUNNER_WORKDIR: ${RUNNER_WORKDIR:?set the absolute work dir path — identical on host and container}
      RUNNER_TOOL_CACHE: /opt/hostedtoolcache
      TZ: ${TZ:-UTC}
      # Optional: wire the job hooks (job rows, workspace wipe, credential sweep,
      # size-gated cache prune — see README.md). Mount the WHOLE hooks dir
      # read-only at the path named here (the hooks source job-row.sh from their
      # own directory), and give every runner the same cache root.
      # ACTIONS_RUNNER_HOOK_JOB_STARTED: /runner-hooks/job-started.sh
      # ACTIONS_RUNNER_HOOK_JOB_COMPLETED: /runner-hooks/job-completed.sh
      # HF_CI_CACHE: ${HF_CI_CACHE}
      # HF_CI_PRUNE_IMAGE: hf-runner:<tag>   # defaults to this container's own image
      # HF_CI_CACHE_CAPS: "<repo>:<GB>"      # du cap per cache repo dir (README "Cache pruning")
      # HF_CI_BUILDER_CONTAINER: <name>      # persistent BuildKit builder, if any
      # HF_CI_CGROUP_PARENT: hf-ci.slice     # sibling containers the hooks start join this slice
    volumes:
      # Persistent runner identity + self-update state — see README.md.
      - ${RUNNER_STATE_DIR:?set the host path for this runner's state dir}:/runner
      # Work dir: same absolute path on both sides of the mount (DooD).
      - ${RUNNER_WORKDIR:?}:${RUNNER_WORKDIR:?}
      # Shared tool cache across all runners on this box.
      - ${RUNNER_TOOLCACHE_DIR:?set the host path for the shared tool cache}:/opt/hostedtoolcache
      # Docker socket — the runner user's access to it is granted at container
      # start time by entrypoint.sh (it maps the socket's own GID into the
      # runner user's supplementary groups), not by anything declared here.
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional, with the env block above:
      # - ./hooks:/runner-hooks:ro
      # - ${HF_CI_CACHE}:${HF_CI_CACHE}   # identical path on both sides (DooD)
    mem_limit: 4g
    cpus: "2.0"
    # Join the CI cgroup slice (systemd cgroup driver: a slice name; with the
    # cgroupfs driver use a path such as /hf-ci). Needs the slice to exist first.
    # cgroup_parent: hf-ci.slice
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
