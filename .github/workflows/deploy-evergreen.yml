name: Deploy to evergreen (reusable)

# The estate's standard deploy, once instead of fourteen times:
#   - build the image on a GH-hosted ubuntu-latest runner
#   - push it to GHCR with a registry build cache
#   - deploy to the target host over the shared cloudflared tunnel, SSHing as
#     the unprivileged `deploy` user. authorized_keys pins each app's key to
#     its own /srv/run-deploy-<app>.sh, so a key can ONLY trigger that one
#     script — never arbitrary commands on prod.
# No self-hosted runner; CI never shares a host with production.
#
# THIS WORKFLOW DOES NOT RUN YOUR TESTS. It cannot: it has no idea what your
# suite is. The caller MUST gate it, e.g. `needs: [ci]` on a bun-ci.yml call.
# Both housekeeping and income-ledger carry a scar comment about this exact
# gap — a deploy job that only `needs` its own build job let a red test suite
# reach production (four commits, on one of them). If you copy the caller
# snippet from the README, keep the `needs:`.

on:
  workflow_call:
    inputs:
      app_name:
        description: >-
          Short app slug — the deploy concurrency group and the job names.
          Must match the app's run-deploy shim on the host.
        required: true
        type: string
      image:
        description: >-
          LEGACY. Fully-qualified image name, e.g.
          ghcr.io/thehfhotel/housekeeping. Mutually exclusive with
          `image_name` — set exactly one. Always pushes to GHCR with
          GITHUB_TOKEN; no IMAGE_REGISTRY is written to the deploy .env.
        required: false
        type: string
        default: ""
      image_name:
        description: >-
          Bare app segment, e.g. hf-analytics (no registry prefix). Mutually
          exclusive with `image` — set exactly one. The registry is resolved
          at build time: GHCR (`ghcr.io/<owner>`) unless the `image_registry`
          secret is set, in which case that value is used instead. Either
          way the resolved registry is written to the deploy .env as
          `IMAGE_REGISTRY`, which the caller's compose file reads via
          `${IMAGE_REGISTRY:?IMAGE_REGISTRY missing}/<image_name>`.
        required: false
        type: string
        default: ""
      runner_labels:
        description: >-
          JSON array of runner labels, e.g. '["self-hosted","<box-label>"]'.
          Applied to both the build and deploy jobs via `fromJSON` when
          non-empty; empty (the default) keeps both jobs on `ubuntu-latest`,
          so every existing caller is unaffected.
        required: false
        type: string
        default: ""
      build_timeout_minutes:
        description: "timeout-minutes for the build job."
        required: false
        type: number
        default: 30
      deploy_timeout_minutes:
        description: "timeout-minutes for the deploy job."
        required: false
        type: number
        default: 15
      host_port:
        description: >-
          Host port the compose stack binds, written to the container .env as
          HOST_PORT. String, not number, so a leading zero or a quoted port
          survives round-tripping.
        required: true
        type: string
      context:
        description: "Docker build context."
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile, relative to the repo root."
        required: false
        type: string
        default: "Dockerfile"
      compose_path:
        description: >-
          Compose file to ship to the host. Renamed to docker-compose.yml
          inside the tarball if it is called something else, because the
          run-deploy shim only ever looks for that name (the
          room-daily-reporter / docker-compose.hfville.yml case).
        required: false
        type: string
        default: "docker-compose.yml"
      platforms:
        description: "Buildx target platforms."
        required: false
        type: string
        default: "linux/amd64"
      force_deploy:
        description: >-
          Skip the build and re-roll whatever the image's :latest tag already
          points at — secret rotation, restarting a wedged container, a
          compose-only change. An empty commit is NOT an alternative: it
          produces a green run that deploys nothing.
        required: false
        type: boolean
        default: false
    secrets:
      ssh_key:
        description: "Private deploy key for this app (forced-command pinned on the host)."
        required: true
      host_key:
        description: "known_hosts entry for the deploy host."
        required: true
      env_payload:
        description: >-
          PRE-MATERIALIZED runtime env, one KEY=VALUE per line, appended to the
          container .env verbatim after IMAGE_TAG and HOST_PORT.

          A reusable workflow cannot enumerate the caller's secrets, so the
          caller renders them into this one value (see the README snippet).
          Passed as a secret, not an input, so every component stays masked in
          the logs.

          One line per variable, no multi-line values — docker compose's .env
          parser does not support them, so base64 anything with a newline. The
          deploy step validates the shape and refuses a payload that is not
          KEY=VALUE lines rather than writing a malformed .env into prod.
        required: false
      deploy_host:
        description: >-
          SSH target, default evergreen.thehfhotel.org. This repo is PUBLIC:
          a host reachable only by its tailnet address (hfville, 100.64.x.x)
          MUST arrive here as a secret and must never be committed as a
          default. See the README.
        required: false
      image_registry:
        description: >-
          Optional. Registry prefix for the image_name path, e.g.
          `ghcr.io/thehfhotel` or the estate's own registry host. Unset means
          GHCR is used automatically. Only meaningful with `image_name` — set
          with `image` (the legacy input) is a hard error, since the legacy
          path is always GHCR. This repo is PUBLIC: an internal registry
          hostname or tailnet address MUST arrive here as a secret, never as
          a literal in a caller's workflow file.
        required: false
      registry_user:
        description: "Username for docker login when image_registry is set."
        required: false
      registry_token:
        description: "Password/token for docker login when image_registry is set."
        required: false
    outputs:
      image_tag:
        description: "Tag actually deployed (the commit SHA, or empty on force_deploy)."
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    name: Build & push
    # Skipped, not failed, on force_deploy — the deploy gate below is written
    # to read that as permission to re-roll :latest.
    if: ${{ !inputs.force_deploy }}
    runs-on: ${{ inputs.runner_labels != '' && fromJSON(inputs.runner_labels) || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.build_timeout_minutes }}
    permissions:
      contents: read
      packages: write
    outputs:
      # image_ref and registry are deliberately NOT exposed here. On the
      # image_registry path, steps.selection.outputs.registry (and image_ref,
      # which contains it) equal the `image_registry` secret's value —
      # GitHub redacts a job output that equals a secret to an EMPTY string
      # ("Skip output {output.Key} since it may contain secret."), so this
      # job's outputs would come back empty on every successful build that
      # uses the estate's own registry, not just on a force_deploy skip. The
      # deploy job recomputes the registry itself instead, from the same
      # inputs/secrets this job used, so it never depends on a value GitHub
      # may silently drop.
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      # Same refusal as the deploy job's, but BEFORE anything is pushed: on a
      # pull_request-triggered caller this job would otherwise build the PR's
      # unreviewed code and push it as :latest — poisoning the very tag that
      # force_deploy re-rolls onto production — and only then would the deploy
      # job's guard fire. startsWith also catches pull_request_target (which
      # carries real secrets, making it worse, not safer) and the
      # pull_request_review events, whose github.sha is likewise PR code.
      - name: Refuse to build from a pull_request
        if: startsWith(github.event_name, 'pull_request')
        run: |
          echo "::error::deploy-evergreen.yml was called from a ${GITHUB_EVENT_NAME}-triggered workflow. Restrict the calling workflow to push / workflow_dispatch."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5.0.0
        with:
          persist-credentials: false

      # Fail-closed selection between the legacy `image` input (full ref,
      # always GHCR) and the new `image_name` input (bare app segment, with
      # the registry resolved here — GHCR by default, or the caller's own
      # registry via the `image_registry` secret). Exactly one of `image` /
      # `image_name` may be set. Runs BEFORE login/build so a config error
      # (both set, or a registry secret with no image_name) is refused before
      # anything is built or pushed, not discovered mid-push.
      - name: Resolve image registry
        id: selection
        env:
          IMAGE: ${{ inputs.image }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_REGISTRY_SECRET: ${{ secrets.image_registry }}
          REGISTRY_USER_SECRET: ${{ secrets.registry_user }}
          REGISTRY_TOKEN_SECRET: ${{ secrets.registry_token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          fail() {
            {
              echo "registry="
              echo "image_ref="
              echo "login_host="
              echo "login_mode=none"
            } >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }

          if [ -n "$IMAGE" ] && [ -n "$IMAGE_NAME" ]; then
            fail "Both 'image' and 'image_name' inputs are set — pick one. 'image' is the legacy full ref (always GHCR); 'image_name' is the bare app segment that lets this workflow pick the registry."
          fi

          if [ -z "$IMAGE" ] && [ -z "$IMAGE_NAME" ]; then
            fail "Neither 'image' nor 'image_name' is set — set exactly one. 'image' is the legacy full ref (always GHCR); 'image_name' is the bare app segment that lets this workflow pick the registry."
          fi

          if [ -z "$IMAGE_NAME" ] && [ -n "$IMAGE_REGISTRY_SECRET" ]; then
            fail "secrets.image_registry is set but inputs.image_name is empty. image_registry only applies on the image_name path."
          fi

          if [ -z "$IMAGE_NAME" ]; then
            # Legacy path — unchanged behaviour. No IMAGE_REGISTRY line is
            # written to the deploy .env; the caller's compose file still
            # hardcodes ghcr.io/... in its own `image:` line.
            {
              echo "registry="
              echo "image_ref=$IMAGE"
              echo "login_host=ghcr.io"
              echo "login_mode=ghcr"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$IMAGE_REGISTRY_SECRET" ]; then
            # image_name set, no registry secret: GHCR fallback. Behaviour is
            # identical to the legacy path except the caller's compose file
            # now reads IMAGE_REGISTRY from .env instead of hardcoding
            # ghcr.io/<owner> — this is what makes a switch to image_name
            # mergeable before any registry cutover.
            registry="ghcr.io/$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
            {
              echo "registry=$registry"
              echo "image_ref=$registry/$IMAGE_NAME"
              echo "login_host=ghcr.io"
              echo "login_mode=ghcr"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # image_name set AND image_registry set: the caller's own registry.
          # login_host strips any path segment (a registry value may already
          # include a namespace, e.g. ghcr.io/some-org) since docker/login-
          # action's `registry:` input wants a bare host.
          if [ -z "$REGISTRY_USER_SECRET" ] || [ -z "$REGISTRY_TOKEN_SECRET" ]; then
            fail "secrets.image_registry is set but registry_user/registry_token are missing — cannot authenticate the push."
          fi
          registry="$IMAGE_REGISTRY_SECRET"
          login_host="${registry%%/*}"
          {
            echo "registry=$registry"
            echo "image_ref=$registry/$IMAGE_NAME"
            echo "login_host=$login_host"
            echo "login_mode=registry"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ steps.selection.outputs.login_host }}
          username: ${{ steps.selection.outputs.login_mode == 'ghcr' && github.actor || secrets.registry_user }}
          password: ${{ steps.selection.outputs.login_mode == 'ghcr' && secrets.GITHUB_TOKEN || secrets.registry_token }}

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ steps.selection.outputs.image_ref }}
          # The sha tag gets an explicit priority ABOVE raw's default (200):
          # `steps.meta.outputs.version` — which becomes this workflow's
          # image_tag output and the host .env's IMAGE_TAG — is the
          # highest-priority tag. With the defaults (sha=100 < raw=200) every
          # deploy silently "pinned" :latest, which only worked because the
          # same run had just refreshed :latest — and quietly broke rollback
          # semantics and the deployed-tag audit trail (found 2026-08-13 by
          # the fingerprint conversion's IMAGE_TAG verification).
          tags: |
            type=sha,prefix=,priority=900
            type=raw,value=latest

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          # Registry cache, not type=gha: a single image per repo, and the GHA
          # cache is scoped per-repo anyway, which a shared reusable workflow
          # would silently thrash across callers.
          cache-from: type=registry,ref=${{ steps.selection.outputs.image_ref }}:buildcache
          cache-to: type=registry,ref=${{ steps.selection.outputs.image_ref }}:buildcache,mode=max

  deploy:
    name: Deploy ${{ inputs.app_name }}
    needs: [build]
    runs-on: ${{ inputs.runner_labels != '' && fromJSON(inputs.runner_labels) || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.deploy_timeout_minutes }}
    permissions:
      contents: read
      packages: read
    # Per-app group: two back-to-back pushes to the same repo can never have
    # their `docker compose up` interleave. cancel-in-progress is OFF because
    # an in-flight deploy has already pulled images and may be mid-migration;
    # aborting it leaves the stack in a mismatched state.
    #
    # Concurrency groups are scoped to the CALLING repository, so this does NOT
    # serialize two different apps against each other. That is deliberate —
    # separate compose stacks are independent. Where two pipelines share host
    # state (HF-finance's payroll + reimbursement both bind /home/deploy/
    # kbiz-queue) the callers must pass the SAME app_name, or serialize
    # themselves with their own group.
    concurrency:
      group: deploy-evergreen-${{ inputs.app_name }}
      cancel-in-progress: false
    # `always()` because a SKIPPED `needs` would otherwise skip this job too.
    #
    # The success-or-skipped guard is load-bearing and is not a formality: a
    # FAILED build must block the deploy, while a build skipped by
    # force_deploy must permit it. Writing this as `needs.build.result !=
    # 'failure'` or leaning on `always()` alone would let a red build re-roll
    # :latest onto production and still report a green run. Keep the explicit
    # success-or-skipped disjunction.
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    steps:
      # The caller owns its triggers, and this workflow deploys to PRODUCTION.
      # Fail rather than skip: on a sibling repo a deploy that quietly skipped
      # still reported a green run, and 6 of 26 "successful" runs had deployed
      # nothing before anyone noticed.
      - name: Refuse to deploy from a pull_request
        if: startsWith(github.event_name, 'pull_request')
        run: |
          echo "::error::deploy-evergreen.yml was called from a ${GITHUB_EVENT_NAME}-triggered workflow. Restrict the calling workflow to push / workflow_dispatch."
          exit 1

      - name: Checkout compose file
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5.0.0
        with:
          persist-credentials: false
          sparse-checkout: ${{ inputs.compose_path }}
          sparse-checkout-cone-mode: false

      # A reusable workflow runs against the CALLER's checkout, so
      # `uses: ./.github/actions/evergreen-ssh` would resolve to a path in the
      # caller's repo and fail — or, worse, silently run the caller's own stale
      # copy of the action. This repo has to check ITSELF out to use its own
      # composite action.
      #
      # `job.workflow_repository` / `job.workflow_sha` name the file that
      # defines the CURRENT job — i.e. this reusable workflow, at the exact
      # commit the caller pinned. So the composite action always comes from the
      # same commit as the workflow calling it; the two can never drift apart
      # mid-rollout, and no second SHA needs bumping by hand.
      # (`github.workflow_sha` is the CALLER's top-level workflow — wrong one.)
      #
      # actionlint 1.7.x does not yet know these two properties and will report
      # `property "workflow_sha" is not defined`. That is a stale context model
      # in the linter, not a bug here — the properties are documented under the
      # `job` context and mirror the long-standing `job_workflow_sha` OIDC
      # claim. Run actionlint with
      #   -ignore 'property "workflow_(sha|repository)" is not defined'
      # rather than "fixing" this back to github.workflow_sha, which silently
      # resolves to the caller's workflow and would check out the wrong repo.
      - name: Resolve estate-ci's own repo and commit
        id: self
        env:
          SELF_REPO: ${{ job.workflow_repository }}
          SELF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          # Empty means the runner does not populate job.workflow_* (GitHub
          # Enterprise Server). Refuse loudly rather than let the checkout below
          # fall back to the caller's repo at its default branch, which would
          # run an unpinned action from the wrong repository.
          for v in SELF_REPO SELF_SHA; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is empty — cannot locate estate-ci's own commit (job.workflow_* is github.com-only). Workaround: replace the checkout below with literal repository/ref values."
              exit 1
            fi
          done
          echo "repo=$SELF_REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$SELF_SHA"   >> "$GITHUB_OUTPUT"

      - name: Checkout estate-ci at this workflow's own commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5.0.0
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.sha }}
          path: .estate-ci
          persist-credentials: false

      - name: Set up SSH access
        uses: ./.estate-ci/.github/actions/evergreen-ssh
        with:
          ssh-key: ${{ secrets.ssh_key }}
          host-key: ${{ secrets.host_key }}

      - name: Deploy via SSH
        id: deploy
        env:
          # GITHUB_TOKEN's packages:read scope is enough for `docker pull` from
          # the caller's GHCR images, and it expires when the run ends — no
          # long-lived credential comes to rest on the host. The token that
          # leaves the CI boundary must carry no repo-write capability, which
          # is what this job's `permissions:` block above pins.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          BUILD_RESULT: ${{ needs.build.result }}
          APP_NAME: ${{ inputs.app_name }}
          COMPOSE_PATH: ${{ inputs.compose_path }}
          HOST_PORT: ${{ inputs.host_port }}
          ENV_PAYLOAD: ${{ secrets.env_payload }}
          DEPLOY_HOST: ${{ secrets.deploy_host || 'evergreen.thehfhotel.org' }}
          IMAGE: ${{ inputs.image }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_REGISTRY_SECRET: ${{ secrets.image_registry }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # The build job's own "Resolve image registry" step already refuses
          # a bad image/image_name/image_registry combination — but that step
          # lives in the `build` job, which `force_deploy` SKIPS entirely (see
          # `if: ${{ !inputs.force_deploy }}` on that job). With force_deploy
          # set, those checks never run, and this job would otherwise sail
          # past straight to the ssh call below with, e.g., `image_registry`
          # set but `image_name` empty. Replicate the same fail-closed checks
          # here, before anything touches the host, using the raw
          # inputs/secrets (not the build job's outputs, which are empty on a
          # skip regardless of whether the config was actually valid).
          if [ -n "${IMAGE:-}" ] && [ -n "${IMAGE_NAME:-}" ]; then
            echo "::error::Both 'image' and 'image_name' inputs are set — pick one. 'image' is the legacy full ref (always GHCR); 'image_name' is the bare app segment that lets this workflow pick the registry."
            exit 1
          fi
          if [ -z "${IMAGE:-}" ] && [ -z "${IMAGE_NAME:-}" ]; then
            echo "::error::Neither 'image' nor 'image_name' is set — set exactly one. 'image' is the legacy full ref (always GHCR); 'image_name' is the bare app segment that lets this workflow pick the registry."
            exit 1
          fi
          if [ -z "${IMAGE_NAME:-}" ] && [ -n "${IMAGE_REGISTRY_SECRET:-}" ]; then
            echo "::error::secrets.image_registry is set but inputs.image_name is empty. image_registry only applies on the image_name path."
            exit 1
          fi

          # A `secrets.SOMETHING` reference that does not exist renders as ""
          # and the variable is still SET, so `set -u` never trips on it. Fail
          # before touching the host rather than shipping a well-formed payload
          # with an empty GHCR token, which the shim turns into a `docker pull`
          # denial halfway through a deploy.
          for v in GHCR_TOKEN DEPLOY_HOST HOST_PORT; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Required value $v is empty — aborting before contacting the host."
              exit 1
            fi
          done

          # force_deploy skipped the build, so there is no SHA tag to deploy —
          # re-roll whatever :latest currently points at. ONLY a skipped build
          # earns the fallback: an empty tag out of a SUCCESSFUL build means
          # the output wiring broke (a metadata-action output rename, say),
          # and silently deploying a stale :latest inside a green run is the
          # exact failure mode this estate keeps scar comments about.
          if [ -z "${IMAGE_TAG:-}" ]; then
            if [ "${BUILD_RESULT:-}" != "skipped" ]; then
              echo "::error::build result is '${BUILD_RESULT:-}' yet image_tag is empty — the build output wiring is broken. Refusing to fall back to :latest."
              exit 1
            fi
            IMAGE_TAG=latest
            echo "::notice::No build in this run — re-rolling ${APP_NAME} at :latest."
          fi

          # The run-deploy shim only ever looks for docker-compose.yml.
          if [ "$COMPOSE_PATH" != "docker-compose.yml" ]; then
            mv "$COMPOSE_PATH" docker-compose.yml
          fi

          # Deterministically recompute the registry here, unconditionally,
          # from the same inputs/secrets the build job used — never from a
          # build job OUTPUT. On the image_registry path, a job output that
          # equals a secret's value is redacted to an EMPTY string by GitHub
          # ("Skip output {output.Key} since it may contain secret."), so a
          # value threaded through `needs.build.outputs.*` would come back
          # empty on every SUCCESSFUL build using the estate's own registry,
          # not only on a force_deploy skip — silently dropping
          # IMAGE_REGISTRY from the host .env on exactly the runs where it
          # matters most. Legacy `image` callers never set IMAGE_NAME, so
          # REGISTRY stays empty for them and nothing new is written below.
          REGISTRY=""
          if [ -n "${IMAGE_NAME:-}" ]; then
            if [ -n "${IMAGE_REGISTRY_SECRET:-}" ]; then
              REGISTRY="$IMAGE_REGISTRY_SECRET"
            else
              REGISTRY="ghcr.io/$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
            fi
          fi
          # Expose for the Deploy summary step below — REGISTRY may equal a
          # secret (image_registry), so GitHub redacts it in logs/summaries
          # automatically wherever it's later printed; this output is only
          # consumed to build the fully-qualified image reference, never
          # echoed on its own.
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

          # Validate the caller's env block BEFORE it becomes a prod .env.
          # Never echo a line — it holds secrets; report the line number only.
          if [ -n "${ENV_PAYLOAD:-}" ]; then
            lineno=0
            while IFS= read -r line; do
              lineno=$((lineno + 1))
              case "$line" in
                ''|'#'*) continue ;;
              esac
              if ! printf '%s\n' "$line" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*='; then
                echo "::error::env_payload line $lineno is not KEY=VALUE. One line per variable, no multi-line values (base64 anything with a newline). Value withheld — it is a secret."
                exit 1
              fi
            done <<< "$ENV_PAYLOAD"
          fi

          # Runtime env shipped alongside compose; docker compose reads ./.env
          # on `up`. Caller-supplied lines are written unconditionally, empty
          # values included: an empty value is a valid (usually fail-closed)
          # state, and writing it explicitly means a rotated-then-cleared
          # secret cannot leave a stale value behind in the container.
          {
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'HOST_PORT=%s\n' "$HOST_PORT"
            if [ -n "${REGISTRY:-}" ]; then
              printf 'IMAGE_REGISTRY=%s\n' "$REGISTRY"
            fi
            if [ -n "${ENV_PAYLOAD:-}" ]; then
              printf '%s\n' "$ENV_PAYLOAD"
            fi
          } > .env
          tar -czf /tmp/deploy.tar.gz docker-compose.yml .env
          rm -f .env

          # The forced command in the host's authorized_keys runs
          # /srv/run-deploy-<app>.sh with this JSON as stdin. No other command
          # is reachable from this key.
          jq -n \
            --arg commit_sha         "$GITHUB_SHA" \
            --arg deploy_payload_b64 "$(base64 -w0 < /tmp/deploy.tar.gz)" \
            --arg ghcr_user          "$GHCR_USER" \
            --arg ghcr_token         "$GHCR_TOKEN" \
            '{
              commit_sha: $commit_sha,
              deploy_payload_b64: $deploy_payload_b64,
              ghcr: { user: $ghcr_user, token: $ghcr_token }
            }' \
          | ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ProxyCommand="cloudflared --edge-ip-version 4 access ssh --hostname %h" \
              "deploy@${DEPLOY_HOST}"

      - name: Deploy summary
        run: |
          # Build the fully-qualified image from this job's own recomputed
          # REGISTRY (steps.deploy.outputs.registry), never from a build job
          # output — see the "Deploy via SSH" step for why those are
          # unreliable on the image_registry path. Legacy `image` callers
          # have no IMAGE_NAME/REGISTRY at all, so they fall through to the
          # legacy full ref unchanged.
          if [ -n "${IMAGE_NAME:-}" ]; then
            if [ -n "${REGISTRY:-}" ]; then
              IMAGE="${REGISTRY}/${IMAGE_NAME}"
            else
              IMAGE="${IMAGE_NAME}"
            fi
          fi
          {
            echo "## ${APP_NAME} deployed"
            echo ""
            echo "- Image: \`${IMAGE}:${IMAGE_TAG:-latest}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          APP_NAME: ${{ inputs.app_name }}
          IMAGE: ${{ inputs.image || inputs.image_name }}
          IMAGE_NAME: ${{ inputs.image_name }}
          REGISTRY: ${{ steps.deploy.outputs.registry }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
